# nginx's default `combined` access log writes the full request URI including
# its query string; the admin invite and reset-password links carry a one-time
# `?token=`, and the same URL is repeated in later requests' Referer header.
# Both are therefore logged as their path only (everything before `?`).
map $request_uri $kayi_log_path {
    "~^([^?]*)" $1;
}
map $http_referer $kayi_log_referer {
    ""          "-";
    "~^([^?]*)" $1;
}
log_format kayi_safe '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $kayi_log_path $server_protocol" '
                     '$status $body_bytes_sent "$kayi_log_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log kayi_safe;

    # Serve files directly from the dashboard dist directory — no subpath redirect needed.
    # Accessing http://localhost:7000 opens the admin login page immediately.
    root /usr/share/nginx/html/dashboard;
    index index.html;

    # Long-lived caching for hashed static assets
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images/icons — cache but allow revalidation
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA entry — always revalidate so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # All other requests fall through to the SPA
    location / {
        try_files $uri /index.html;
    }
}
