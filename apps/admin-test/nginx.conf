server {
    listen 80;
    server_name _;

    # Serve files directly from the dashboard dist directory — no subpath redirect needed.
    # Accessing http://localhost:7000 opens the admin login page immediately.
    root /usr/share/nginx/html/dashboard;
    index index.html;

    # Long-lived caching for hashed static assets
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images/icons — cache but allow revalidation
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA entry — always revalidate so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # All other requests fall through to the SPA
    location / {
        try_files $uri /index.html;
    }
}
