# nginx'in varsayılan `combined` erişim logu isteğin tam adresini sorgu
# dizesiyle birlikte yazar; vendor davet ve şifre sıfırlama bağlantıları tek
# kullanımlık `?token=` taşır, aynı adres sonraki isteklerin Referer
# başlığında da tekrar görünür. İkisi de loga yalnızca yol olarak (`?`
# öncesi) yazılır.
map $request_uri $kayi_log_path {
    "~^([^?]*)" $1;
}
map $http_referer $kayi_log_referer {
    ""          "-";
    "~^([^?]*)" $1;
}
log_format kayi_safe '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $kayi_log_path $server_protocol" '
                     '$status $body_bytes_sent "$kayi_log_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log kayi_safe;

    # Vendor SPA dosyaları doğrudan /seller dizininden servis edilir.
    # Bu sayede Vite base:'/' olarak kalır ve React Router subpath sorunu yaşamaz.
    root /usr/share/nginx/html/seller;
    index index.html;

    # Long-lived caching for hashed static assets
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Onboarding heroes — short TTL so JPEG updates ship quickly
    location /onboarding/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Other images/icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA entry — always revalidate so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # Tüm istekler SPA index.html'e yönlendirilir — React Router halleder
    location / {
        try_files $uri /index.html;
    }
}
